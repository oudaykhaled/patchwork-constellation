services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: patchwork
      POSTGRES_USER: patchwork
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - patchwork-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchwork -d patchwork"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  patchwork-postgres:
