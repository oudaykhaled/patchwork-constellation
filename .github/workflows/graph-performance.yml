name: Graph target budgets

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: graph-budgets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  target-envelope:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config playwright.performance.config.ts
        env:
          GRAPH_BENCHMARK_BUILD: production
          GRAPH_BENCHMARK_COMMIT: ${{ github.sha }}
          GRAPH_ENFORCE_BUDGETS: 'true'
          GRAPH_BENCHMARK_CONCURRENCY: dedicated single-worker GitHub Actions job
          GRAPH_BENCHMARK_OUTPUT: test-results/graph-budgets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: graph-budget-numeric-evidence
          path: |
            test-results/graph-budgets/*.json
            test-results/**/rendered-*.png
          retention-days: 7
          if-no-files-found: ignore
